---
name: "Go CI"

on:
  workflow_call

jobs:
  ci:
    name: "Run CI"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Setup a go environment
        uses: WillAbides/setup-go-faster@639648f05d976dbc4cb976e9d94ba19efc7b9294 # v1.15.0
        with:
          go-version: "stable"

      - run: "go test ./..."

      - run: "go vet ./..."

      - name: Run Staticcheck
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1.4.1
        with:
          version: "latest"
          install-go: false
